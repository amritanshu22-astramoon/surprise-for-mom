<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Our Memories ❤️</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- Navigation -->

    <nav>

        <a href="index.html">
            Home
        </a>

        <a class="active" href="memories.html">
            Memories
        </a>

        <a href="letter.html">
            A Letter
        </a>

    </nav>


    <!-- Music -->

    <audio id="audio" loop>

        <source
            src="music/birthday-song.mp3"
            type="audio/mpeg">

    </audio>


    <button class="music-button" id="musicButton">

        <span id="musicIcon">
            ♪
        </span>

        <span id="musicText">
            Play Music
        </span>

    </button>


    <main>

        <section class="memories-section">


            <div class="center-section">

                <div class="eyebrow">
                    LITTLE MOMENTS, FOREVER KEPT
                </div>

                <h2>
                    Our Memories
                </h2>

                <p>
                    Four photographs. A thousand feelings.
                </p>

            </div>


            <!-- PHOTO GALLERY -->

            <div class="gallery">


                <figure>

                    <img
                        src="images/photo1.png"
                        alt="Mom and Dad">

                    <figcaption>
                        Where the story began.
                    </figcaption>

                </figure>



                <figure>

                    <img
                        src="images/photo2.png"
                        alt="Mom in blue saree">

                    <figcaption>
                        Beautiful, just being you.
                    </figcaption>

                </figure>



                <figure>

                    <img
                        src="images/photo3.png"
                        alt="Family selfie">

                    <figcaption>
                        Some of my favourite smiles.
                    </figcaption>

                </figure>



                <figure>

                    <img
                        src="images/photo4.png"
                        alt="Mom outdoors">

                    <figcaption>
                        Grace in every little moment.
                    </figcaption>

                </figure>


            </div>


            <!-- QUOTE -->

            <div class="quote">

                <p>

                    "The older I get,
                    the more I understand how much
                    of the good in me began with you."

                </p>

            </div>


        </section>

    </main>


    <footer>

        Every memory with you
        is a memory worth keeping. ❤️

    </footer>


    <script src="script.js"></script>

</body>

</html>
